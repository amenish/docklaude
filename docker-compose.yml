services:
  # Prepara el volumen de ~/.claude con el UID/GID del usuario del host.
  claude-init:
    image: alpine:3.22
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /home/agent/.claude
        chown -R ${CONTAINER_UID}:${CONTAINER_GID} /home/agent
    user: "0:0"
    volumes:
      - claude-home:/home/agent
    restart: "no"

  claude:
    build:
      context: .
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
    image: local/claude-code-sandbox:latest
    working_dir: /workspace

    # Claude corre con el UID/GID del usuario del host, para que los
    # archivos creados en /workspace sean suyos y no de root.
    user: "${CONTAINER_UID:?CONTAINER_UID is required}:${CONTAINER_GID:?CONTAINER_GID is required}"

    stdin_open: true
    tty: true
    init: true

    # Imagen en solo lectura: solo se escribe en el workspace y en el home.
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512
    mem_limit: 8g
    cpus: 4.0

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /run:rw,noexec,nosuid,nodev,size=64m

    volumes:
      # El proyecto elegido: el único directorio de trabajo del host.
      - type: bind
        source: ${WORKSPACE_DIR:?WORKSPACE_DIR is required}
        target: /workspace
        read_only: false

      # Configuración y login de Claude, propios de cada PC.
      - type: volume
        source: claude-home
        target: /home/agent
        read_only: false

      # Memoria colectiva: clon privado en ./claude-memory (ignorado por
      # este repo), sincronizado por run-claude.sh antes y después.
      - type: bind
        source: ./claude-memory
        target: /home/agent/.claude/memoria-colectiva
        read_only: false

      # Instrucciones globales que se cargan en cada sesión.
      - type: bind
        source: ./claude-memory/CLAUDE.md
        target: /home/agent/.claude/CLAUDE.md
        read_only: true

    environment:
      # La memoria vive solo en claude-memory/ y en /workspace/.PROJECT.md.
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
      DOCKLAUDE_HOST: ${DOCKLAUDE_HOST:-}

    networks:
      - agent-net

    depends_on:
      claude-init:
        condition: service_completed_successfully

volumes:
  claude-home:
    name: claude-code-home

networks:
  agent-net:
    driver: bridge
